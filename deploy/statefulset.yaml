---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: runescape
  namespace: runescape
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runescape
  template:
    metadata:
      labels:
        app: runescape
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - shitbox
      terminationGracePeriodSeconds: 35
      # TODO: pre-termination with systemctl stop dragonwilds
      containers:
        - name: runescape
          image: ghcr.io/runescape/rsdw-dedicated
          imagePullPolicy: Always
          resources:
            requests:
              memory: "4Gi"
            limits:
              memory: "18Gi"
          # Restart the server when its log goes quiet. A healthy server logs at
          # least every ~30s (EOS heartbeat), even when empty. On 2026-10-02 it
          # stopped logging at the memory limit and hung for an hour before the
          # OOM kill. The game's process name is truncated to RSDragonwildsSe.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  pgrep -x RSDragonwildsSe >/dev/null
                  && [ $(( $(date +%s) - $(stat -c %Y /home/steam/rsdw-dedicated/RSDragonwilds/Saved/Logs/RSDragonwilds.log) )) -lt 300 ]
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          # steamcmd runs before the server starts, and a full verify or download
          # can take a while, so give it up to an hour to start logging.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  pgrep -x RSDragonwildsSe >/dev/null
                  && [ $(( $(date +%s) - $(stat -c %Y /home/steam/rsdw-dedicated/RSDragonwilds/Saved/Logs/RSDragonwilds.log) )) -lt 300 ]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 120
          envFrom:
            - configMapRef:
                name: config
            - secretRef:
                name: secret
          volumeMounts:
            - name: server-files
              mountPath: /home/steam/rsdw-dedicated
  volumeClaimTemplates:
    - metadata:
        name: server-files
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "local-path"
        resources:
          requests:
            storage: 19Gi
---
apiVersion: v1
kind: Service
metadata:
  name: service-1
  namespace: runescape
  labels:
    app: runescape
spec:
  ports:
    - port: 7777
      name: udp-1
      protocol: UDP
  clusterIP: None
  selector:
    app: runescape
---
apiVersion: v1
kind: Service
metadata:
  name: service-2
  namespace: runescape
  labels:
    app: runescape
spec:
  ports:
    - port: 8888
      name: udp-2
      protocol: UDP
  clusterIP: None
  selector:
    app: runescape
